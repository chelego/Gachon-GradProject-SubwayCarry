behaviors:
  HelpfulCitizen:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 8192
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 100000
    time_horizon: 64
    summary_freq: 5000
    checkpoint_interval: 50000
    keep_checkpoints: 2
engine_settings:
  width: 1280
  height: 720
  quality_level: 0
  time_scale: 8
  target_frame_rate: 60
  capture_frame_rate: 0
torch_settings:
  device: cuda
